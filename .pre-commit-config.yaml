repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: lint-staged
        name: lint-staged (frontend)
        entry: npx lint-staged
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|json|css|md)$
        exclude: ^(backend|services|docs|docs-internal)/

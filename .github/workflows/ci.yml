name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # ruff is pinned twice -- requirements-dev.txt and .pre-commit-config.yaml
      # -- and Dependabot updates each from a different ecosystem, so the two
      # bumps arrive as separate PRs and can land days apart. While they
      # disagree, the hook reformats locally and CI rejects it (or vice versa)
      # -- confusing enough that it is worth failing loudly here instead.
      - name: Verify the ruff pin matches .pre-commit-config.yaml
        working-directory: .
        run: scripts/check-ruff-pin-sync.sh
      - run: ruff check .
      - run: ruff format --check .
      # mypy backlog (~96 pre-existing errors) predates this gate; report only
      # until the backlog is cleaned up, then drop continue-on-error.
      - name: mypy
        continue-on-error: true
        run: mypy app
      - name: Verify Alembic migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      - run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
      - name: pip-audit
        run: |
          pip install pip-audit
          # PYSEC-2026-1325 (ecdsa): Minerva timing attack on the P-256 curve.
          # Ignored deliberately, not overlooked:
          #   * No fixed release exists -- upstream python-ecdsa treats side
          #     channel attacks as out of scope and has no planned fix.
          #   * ecdsa is not a direct dependency; it is pulled in transitively
          #     by python-jose[cryptography], which requires ecdsa!=0.15.
          #   * The affected paths (SigningKey.sign_digest, EC key generation,
          #     ECDH) are unreachable here -- JWTs are signed with HS256
          #     (symmetric HMAC), see backend/app/auth.py.
          # Revisit if the JWT algorithm ever moves to an EC curve, or if
          # python-jose is replaced by a library that drops ecdsa entirely.
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --ignore-vuln PYSEC-2026-1325

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bundle:worker
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Coverage thresholds live in vitest.config.ts and are a floor, not a
      # target (#115): the job fails if coverage slides below where it is now.
      - run: npm run test:coverage
      # Dependency vulnerability scan. Currently reported-only: the backlog
      # has pre-existing high/critical findings in build-time dev dependencies
      # (rollup, vitest, serialize-javascript, ws, yaml). Flip to blocking
      # once that backlog is cleaned up.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e-frontend:
    runs-on: ubuntu-latest
    # Non-blocking for now: the suite covers auth and the core workflow
    # (study load -> AI findings -> QA -> finalize) against a mocked network.
    # Flip to blocking once it has proven stable over a few runs; the
    # docker-stack-backed variant with real DICOM data stays open in #116.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bundle:worker
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  segmenter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/segmenter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/segmenter/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -v --tb=short

  docs-mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: python3 -m mkdocs build --strict

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test, segmenter-test, docs-mkdocs]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile.frontend -t radiolyze-frontend .
      - run: docker build -t radiolyze-backend ./backend
      - run: docker build -t radiolyze-segmenter ./services/segmenter

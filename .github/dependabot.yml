# Review process, held-back majors and the pins that live outside Dependabot
# are documented in docs/en/development/dependencies.md. Every `ignore` entry
# below has a tracking issue; remove the entry in the PR that migrates it.
version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Was lowered to 5 while the backlog was drained. The backlog is drained,
    # so this is back at the default width.
    open-pull-requests-limit: 10
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      # The three Cornerstone packages share a version line and only resolve
      # when bumped together (core/tools/dicom-image-loader).
      cornerstone:
        patterns:
          - "@cornerstonejs/*"
    ignore:
      # Majors that are deliberately held back. Each one has a tracking issue;
      # remove the entry when the corresponding migration lands.
      - dependency-name: "tailwindcss"
        # v4 moves the PostCSS plugin to @tailwindcss/postcss, replaces the
        # @tailwind directives with @import "tailwindcss", and retires
        # tailwindcss-animate. It is the other half of the tailwind-merge entry
        # below -- neither can move without the other -- so it is held with it
        # rather than re-proposed weekly against a build it cannot pass.
        versions: [">=4"]
      - dependency-name: "tailwind-merge"
        # v3 drops Tailwind CSS v3 support and must land together with a
        # Tailwind 4 migration. It declares no peerDependencies, so a bump
        # installs cleanly and silently mis-resolves classes in cn().
        versions: [">=3"]
      - dependency-name: "eslint"
        # Blocked upstream: eslint-plugin-jsx-a11y has no ESLint 10 support yet.
        versions: [">=10"]
      - dependency-name: "vite"
        # lovable-tagger, whose peer range capped Vite at <8, has been removed.
        # Still held because the 5 -> 8 jump itself is a coordinated migration
        # (vitest shares Vite's version line, Node baseline, rollup chunking
        # defaults) that a lone Dependabot bump cannot carry -- see #194.
        versions: [">=8"]
      - dependency-name: "@cornerstonejs/*"
        # Needs a coordinated 4 -> 5 migration incl. vite.config.ts and
        # scripts/bundle-cornerstone-worker.mjs.
        versions: [">=5"]

  # Backend (pip)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # The SDK/exporter (1.4x) and instrumentation (0.6xb0) version lines are
      # pinned to each other. Split across separate PRs every one of them is an
      # unresolvable pip conflict, so they must move as a set.
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      python-dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"

  # Segmenter microservice (pip)
  - package-ecosystem: pip
    directory: "/services/segmenter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Documentation toolchain (pip)
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Pre-commit hook revisions (.pre-commit-config.yaml)
  #
  # ruff is pinned twice -- here and in backend/requirements-dev.txt (the pip
  # entry above) -- and the two arrive as separate PRs that can land days
  # apart. A formatter skew between the hook and CI means the hook writes a
  # file the pipeline then rejects, so scripts/check-ruff-pin-sync.sh fails the
  # build while they disagree. Merge the two ruff PRs together.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pre-commit:
        patterns:
          - "*"

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiolyze</title>
    <meta name="description" content="AI-assisted radiology reporting system" />
    <meta name="author" content="Radiolyze" />

    <meta property="og:title" content="Radiolyze" />
    <meta property="og:description" content="AI-assisted radiology reporting system" />
    <meta property="og:type" content="website" />

    <!-- No og:image/twitter:image: the scaffold's pointed at lovable.dev, which
         branded this app's link previews with a third party and hotlinked an
         external asset. Add one served from this origin if previews matter. -->
    <meta name="twitter:card" content="summary" />

    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('radiolyze-user-preferences');
          if (stored) {
            var prefs = JSON.parse(stored);
            var theme = prefs.theme;
            if (theme === 'light') {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            } else if (theme === 'system') {
              var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              document.documentElement.classList.toggle('dark', isDark);
              document.documentElement.classList.toggle('light', !isDark);
            }
            // else: keep 'dark' class (default)
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

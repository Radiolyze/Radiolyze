# Credentials and shared secrets are REQUIRED variables here (`${VAR:?...}`),
# never defaulted. A missing value makes compose refuse to start with a named
# variable instead of silently bringing the stack up on well-known credentials
# — which is what a copy-paste of this file into a non-local environment used
# to do.
#
# Local development: copy the ready-made dev credentials once, then use compose
# as usual (it auto-loads `.env` for every command):
#
#   cp env.dev .env
#   docker compose up --build
#
# Anything beyond a throwaway sandbox: write your own `.env` from `env.example`.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - see env.example}@db:5432/${POSTGRES_DB:-app}
      # Signs the auth cookie. Never defaulted here: backend/app/auth.py only
      # refuses to start on a weak secret when ENVIRONMENT is production or
      # staging, so a default would leave a development-mode deployment
      # silently signing tokens with a value that is public in this repo.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY - 32+ chars, see env.example}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      INFERENCE_QUEUE_NAME: inference
      INFERENCE_MODEL_VERSION: medgemma-radiology
      INFERENCE_JOB_TIMEOUT: "600"
      INFERENCE_RESULT_TTL: "3600"
      PROMPT_CONFIG_ENABLED: "true"
      VLLM_ENABLED: "false"
      VLLM_BASE_URL: http://vllm-medgemma:8000/v1
      VLLM_MODEL_NAME: medgemma-radiology
      VLLM_REQUEST_TIMEOUT: "120"
      VLLM_FALLBACK_TO_MOCK: "true"
      VLLM_DEFAULT_CONFIDENCE: "0.0"
      VLLM_MAX_TOKENS: "4096"
      VLLM_GUIDED_JSON: "true"
      MEDASR_ENABLED: "true"
      MEDASR_BASE_URL: http://medasr:8001
      MEDASR_TRANSCRIBE_PATH: /v1/audio/transcriptions
      MEDASR_MODEL: google/medasr
      MEDASR_REQUEST_TIMEOUT: "120"
      MEDASR_FALLBACK_TO_MOCK: "false"
      MEDASR_DEFAULT_CONFIDENCE: "0.0"
      DICOM_WEB_BASE_URL: http://orthanc:8042/dicom-web
      DICOM_WEB_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      DICOM_WEB_PASSWORD: ${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD - see env.example}
      DRIFT_SCHEDULE_HOURS: "24"
      DRIFT_WINDOW_DAYS: "7"
      DRIFT_BASELINE_DAYS: "7"
      SEGMENTER_URL: http://segmenter:8200
      SEGMENTER_API_KEY: ${SEGMENTER_API_KEY:?set SEGMENTER_API_KEY - see env.example}
      SEGMENTATION_DATA_DIR: /data/segmentations
      SEGMENTATION_JOB_TIMEOUT: "1800"
      ENABLE_TRACING: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - seg-data:/data/segmentations
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      orthanc:
        condition: service_started
      jaeger:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - see env.example}@db:5432/${POSTGRES_DB:-app}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - see env.example}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      INFERENCE_QUEUE_NAME: inference
      INFERENCE_MODEL_VERSION: medgemma-radiology
      INFERENCE_JOB_TIMEOUT: "600"
      INFERENCE_RESULT_TTL: "3600"
      PROMPT_CONFIG_ENABLED: "true"
      VLLM_ENABLED: "false"
      VLLM_BASE_URL: http://vllm-medgemma:8000/v1
      VLLM_MODEL_NAME: medgemma-radiology
      VLLM_REQUEST_TIMEOUT: "120"
      VLLM_FALLBACK_TO_MOCK: "true"
      VLLM_DEFAULT_CONFIDENCE: "0.0"
      VLLM_MAX_TOKENS: "4096"
      VLLM_GUIDED_JSON: "true"
      MEDASR_ENABLED: "true"
      MEDASR_BASE_URL: http://medasr:8001
      MEDASR_TRANSCRIBE_PATH: /v1/audio/transcriptions
      MEDASR_MODEL: google/medasr
      MEDASR_REQUEST_TIMEOUT: "120"
      MEDASR_FALLBACK_TO_MOCK: "false"
      MEDASR_DEFAULT_CONFIDENCE: "0.0"
      DICOM_WEB_BASE_URL: http://orthanc:8042/dicom-web
      DICOM_WEB_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      DICOM_WEB_PASSWORD: ${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD - see env.example}
      SEGMENTER_URL: http://segmenter:8200
      SEGMENTER_API_KEY: ${SEGMENTER_API_KEY:?set SEGMENTER_API_KEY - see env.example}
      SEGMENTATION_DATA_DIR: /data/segmentations
      SEGMENTATION_JOB_TIMEOUT: "1800"
      ENABLE_TRACING: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: radiolyze-worker
    volumes:
      - seg-data:/data/segmentations
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      jaeger:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # Browser URLs (accessed from host machine)
      VITE_API_BASE_URL: ""
      VITE_WS_URL: ""
      # Vite proxy targets (accessed from within Docker network)
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_DICOM_WEB_PROXY_TARGET: http://orthanc:8042
      # DICOMweb Basic Auth for the dev-server proxy only. Intentionally NOT
      # VITE_-prefixed: Vite embeds every VITE_* var into the client bundle,
      # which would ship these credentials to the browser. The proxy (see
      # vite.config.ts) reads these Node-side and injects the Authorization
      # header itself, so the browser never needs to know them.
      DICOM_WEB_PROXY_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      DICOM_WEB_PROXY_PASSWORD: ${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD - see env.example}
      # API endpoints (relative, go through proxy)
      VITE_ASR_ENDPOINT: /api/v1/reports/asr-transcript
      VITE_QA_CHECK_URL: /api/v1/reports/qa-check
      VITE_AUDIT_LOG_URL: /api/v1/audit-log
      VITE_DICOM_WEB_URL: /dicom-web
      VITE_USE_MOCK_QUEUE: "false"
    depends_on:
      - backend
      - orthanc

  orthanc:
    image: jodogne/orthanc-plugins:1.12.11
    ports:
      - "8042:8042"
      - "4242:4242"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    volumes:
      - orthanc-data:/var/lib/orthanc/db
      # orthanc.json is generated from this template at container startup
      # (see entrypoint.sh) so RegisteredUsers/CORS origin actually track
      # ORTHANC_USERNAME/ORTHANC_PASSWORD/ORTHANC_CORS_ORIGIN below, instead
      # of the hardcoded orthanc/orthanc dev creds and localhost CORS origin.
      - ./orthanc/orthanc.json.template:/etc/orthanc/orthanc.json.template:ro
      - ./orthanc/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD - see env.example}
      ORTHANC_CORS_ORIGIN: ${ORTHANC_CORS_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8042/system"]
      interval: 30s
      timeout: 10s
      retries: 3

  orthanc-seeder:
    image: curlimages/curl:8.6.0
    depends_on:
      - orthanc
    volumes:
      - ./orthanc/seed.sh:/seed/seed.sh:ro
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD - see env.example}
      ORTHANC_SEED_ENABLED: "true"
      # Seed modes: minimal, mri, ct, multiframe, us, rg, compression, color, full
      ORTHANC_SEED_MODE: "full"
    entrypoint: ["/bin/sh", "/seed/seed.sh"]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - see env.example}
    ports:
      # Dev-only: bound to loopback so the DB port isn't reachable from
      # outside the host. Not used by any service in this compose file
      # (backend/worker/migrate reach it over the compose network) — it's
      # exposed only for local `psql`/admin-tool access.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      # Dev-only: bound to loopback, see the `db` port comment above.
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  vllm-medgemma:
    # Pinned to a specific `nightly` digest rather than the mutable tag so
    # the GPU stack is reproducible; vLLM's nightly channel is required here
    # for medgemma-1.5 support. Bump this digest periodically — see
    # `docker manifest inspect vllm/vllm-openai:nightly` for the current one.
    image: vllm/vllm-openai@sha256:184914ac7c32e4aa7789bb686bfaa0817dd56dbdc8ee05fc0ec671aa0b1792f0
    profiles: ["gpu"]
    gpus: all
    ports:
      - "8002:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_LOGGING_LEVEL: INFO
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN:-${HF_TOKEN:-}}
      HF_TOKEN: ${HF_TOKEN:-${HUGGINGFACE_HUB_TOKEN:-}}
    volumes:
      - vllm-cache:/root/.cache/huggingface
    entrypoint: ["vllm"]
    command:
      - serve
      - google/medgemma-1.5-4b-it
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.90"
      - --trust-remote-code
      - --served-model-name
      - medgemma-radiology
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; r=urllib.request.urlopen('http://localhost:8000/v1/models'); json.loads(r.read())"]
      interval: 30s
      timeout: 10s
      retries: 3

  medasr:
    # See the vllm-medgemma comment above re: pinning nightly to a digest.
    image: vllm/vllm-openai@sha256:184914ac7c32e4aa7789bb686bfaa0817dd56dbdc8ee05fc0ec671aa0b1792f0
    profiles: ["gpu"]
    gpus: all
    ports:
      - "8003:8001"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_LOGGING_LEVEL: INFO
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN:-${HF_TOKEN:-}}
      HF_TOKEN: ${HF_TOKEN:-${HUGGINGFACE_HUB_TOKEN:-}}
    volumes:
      - vllm-cache:/root/.cache/huggingface
    entrypoint: ["vllm"]
    command:
      - serve
      - google/medasr
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --dtype
      - float32
      - --max-model-len
      - "1024"
      - --gpu-memory-utilization
      - "0.15"
      - --served-model-name
      - medasr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  segmenter:
    build:
      context: ./services/segmenter
    # No host port mapping: only backend/worker (same compose network) call
    # this service. It carries no auth of its own beyond SEGMENTER_API_KEY,
    # so it must not be reachable directly from the host/internet.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    environment:
      SEGMENTATION_DATA_DIR: /data/segmentations
      DICOM_WEB_BASE_URL: http://orthanc:8042/dicom-web
      DICOM_WEB_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      DICOM_WEB_PASSWORD: ${ORTHANC_PASSWORD:?set ORTHANC_PASSWORD - see env.example}
      BONE_HU_THRESHOLD: "300"
      SEGMENTER_MAX_PARALLEL_WADO: "8"
      SEGMENTER_API_KEY: ${SEGMENTER_API_KEY:?set SEGMENTER_API_KEY - see env.example}
    volumes:
      - seg-data:/data/segmentations
    depends_on:
      - orthanc
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  orthanc-data:
  postgres-data:
  vllm-cache:
  seg-data:
